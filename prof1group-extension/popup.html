<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROF1Group Агент</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <img src="icons/icon48.png" alt="Logo" width="24" height="24" />
      <span>PROF1Group Агент</span>
    </div>
    <div class="header-actions">
      <button id="btn-refresh" class="icon-btn" title="Перевірити зараз">↺</button>
      <button id="btn-options" class="icon-btn" title="Налаштування">⚙</button>
    </div>
  </header>

  <!-- Last check time -->
  <div class="last-check" id="last-check">Перевірка не виконувалась</div>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="tab-new">🆕 Новинки</button>
    <button class="tab" data-tab="tab-cart">🛒 Кошик</button>
    <button class="tab" data-tab="tab-content">📅 Контент</button>
  </nav>

  <!-- Tab: Новинки -->
  <section id="tab-new" class="tab-content active">
    <div class="section-header">
      <span>Нові надходження</span>
      <a href="https://prof1group.ua/catalog/" target="_blank" class="link-btn">Відкрити каталог →</a>
    </div>
    <div id="new-products-list" class="product-list">
      <div class="empty-state">Натисніть ↺ щоб перевірити новинки</div>
    </div>
  </section>

  <!-- Tab: Кошик -->
  <section id="tab-cart" class="tab-content">

    <!-- Search bar -->
    <div class="cart-search-bar">
      <input id="cart-search-input" type="text"
        placeholder="cursor longsleeve, 5.11 jacket, lowa boots..." />
      <button id="btn-cart-search" class="btn btn-primary">🔍</button>
    </div>

    <!-- Search state -->
    <div id="cart-search-state" class="search-state hidden"></div>

    <!-- Search results -->
    <div id="cart-search-results" class="search-results hidden"></div>

    <!-- Cart queue -->
    <div id="cart-queue-section" class="cart-queue-section hidden">
      <div class="queue-header">
        <span>📋 Список для кошика</span>
        <span id="queue-count" class="queue-count">0</span>
        <button id="btn-queue-clear" class="btn-tiny">✕ Очистити</button>
      </div>
      <div id="cart-queue-list" class="queue-list"></div>
      <div class="queue-actions">
        <button id="btn-run-cart" class="btn btn-primary btn-full">▶ Додати все в кошик</button>
        <button id="btn-cart-stop" class="btn btn-danger btn-full hidden">■ Зупинити</button>
      </div>
    </div>

    <!-- Status + log -->
    <div id="cart-status" class="status-box hidden"></div>
    <div id="cart-log" class="log-box"></div>

  </section>

  <!-- Tab: Контент-план -->
  <section id="tab-content" class="tab-content">
    <div class="section-header">
      <span>Контент-план</span>
    </div>

    <div class="content-form">
      <div class="form-row">
        <label>Місяць</label>
        <select id="content-month">
          <option value="1">Січень</option>
          <option value="2">Лютий</option>
          <option value="3">Березень</option>
          <option value="4">Квітень</option>
          <option value="5">Травень</option>
          <option value="6" selected>Червень</option>
          <option value="7">Липень</option>
          <option value="8">Серпень</option>
          <option value="9">Вересень</option>
          <option value="10">Жовтень</option>
          <option value="11">Листопад</option>
          <option value="12">Грудень</option>
        </select>
      </div>
      <div class="form-row">
        <label>Рік</label>
        <input type="number" id="content-year" value="2026" min="2024" max="2030" />
      </div>
      <div class="form-row">
        <label>Фокус</label>
        <select id="content-focus">
          <option value="mixed">Змішаний (рекомендовано)</option>
          <option value="clothing">Одяг та форма</option>
          <option value="footwear">Взуття</option>
          <option value="equipment">Тактичне спорядження</option>
          <option value="protection">Засоби захисту</option>
          <option value="camp">Бівачне спорядження</option>
        </select>
      </div>
      <button id="btn-generate-plan" class="btn btn-primary btn-full">⚡ Згенерувати план</button>
    </div>

    <div id="content-plan-result" class="hidden">
      <div class="plan-actions">
        <button id="btn-download-csv" class="btn btn-secondary">⬇ CSV</button>
        <button id="btn-open-sheets" class="btn btn-sheets">📊 Sheets</button>
        <button id="btn-export-notion" class="btn btn-notion">📝 Notion</button>
      </div>
      <div id="notion-progress" class="notion-progress hidden">
        <div class="notion-bar-wrap"><div id="notion-bar" class="notion-bar"></div></div>
        <div id="notion-progress-text" class="notion-progress-text">Підготовка...</div>
      </div>
      <div id="plan-table-container"></div>
    </div>

    <!-- Google Sheets URL setup (shown when no URL configured) -->
    <div id="sheets-setup" class="sheets-setup hidden">
      <div class="setup-info">
        <strong>Підключення Google Sheets</strong>
        <p>Введіть URL вашого Apps Script для автоматичного запису плану.</p>
        <a href="options.html" target="_blank" class="link-btn">Налаштувати →</a>
      </div>
    </div>
  </section>

  <script src="utils/content-plan.js"></script>
  <script src="utils/sheets.js"></script>
  <script src="utils/notion.js"></script>
  <script src="popup.js"></script>
</body>
</html>
